<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AKG · Cloudflare</title>
  <style>
    :root { --bg:#05070a; --cyan:#22d3ee; --txt:#e8eef4; --dim:#8b98a8; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; overflow:hidden; }
    button { cursor:pointer; font-family:inherit; }
    #app { display:flex; flex-direction:column; height:100%; }
    header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; border-bottom:1px solid rgba(34,211,238,.2); background:#0a0c14; gap:8px; }
    .brand { display:flex; align-items:center; gap:8px; font-family:ui-monospace,Menlo,monospace; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
    .brand h1 { font-size:13px; letter-spacing:.18em; margin:0; }
    .brand small { color:var(--cyan); opacity:.7; font-size:10px; }
    .chip { font-size:10px; font-family:ui-monospace,Menlo,monospace; padding:2px 8px; border-radius:6px; border:1px solid rgba(34,211,238,.35); color:#a5f3fc; background:rgba(6,78,92,.4); }
    .chip.ok { border-color:#34d399; color:#6ee7b7; }
    .chip.bad { border-color:#f43f5e; color:#fda4af; }
    .work { flex:1; display:grid; grid-template-columns:280px 1fr 380px; min-height:0; }
    @media (max-width: 960px) { .work { grid-template-columns:1fr; } .side { display:none; } }
    .side { background:rgba(10,12,20,.92); border-right:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; min-height:0; }
    .side.right { border-right:0; border-left:1px solid rgba(255,255,255,.06); }
    .side h2 { margin:0; padding:10px 12px; font-size:11px; letter-spacing:.12em; color:var(--cyan); font-family:ui-monospace,Menlo,monospace; border-bottom:1px solid rgba(255,255,255,.06); }
    .list { flex:1; overflow:auto; padding:8px; }
    .card { padding:10px; border:1px solid rgba(255,255,255,.08); border-radius:10px; margin-bottom:8px; }
    .card b { display:block; font-size:13px; margin-bottom:4px; }
    .card p { margin:0; font-size:11px; color:var(--dim); line-height:1.45; }
    .stage { position:relative; background:#05070a; }
    canvas { width:100%; height:100%; display:block; }
    .hud { position:absolute; left:12px; top:12px; font-size:11px; font-family:ui-monospace,Menlo,monospace; color:#67e8f9; background:rgba(0,0,0,.55); padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.08); }
    .msgs { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .msg { font-size:13px; line-height:1.55; padding:10px 12px; border-radius:10px; max-width:95%; }
    .msg.user { align-self:flex-end; background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.25); }
    .msg.bot { align-self:flex-start; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
    .composer { padding:10px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:8px; }
    .composer textarea { flex:1; resize:none; height:64px; color:var(--txt); background:#05070a; border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:6px 8px; font-family:inherit; }
    .btn { background:rgba(34,211,238,.15); color:#a5f3fc; border:1px solid rgba(34,211,238,.4); border-radius:8px; padding:8px 12px; font-size:12px; }
    .btn:disabled { opacity:.4; }
    footer { height:28px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:10px; font-family:ui-monospace,Menlo,monospace; color:var(--dim); border-top:1px solid rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>AKG 粒子数字知识体</h1>
          <small>归 Mr.AK · 推理走 Cloudflare Workers AI</small>
        </div>
      </div>
      <span id="status" class="chip">检测 Cloudflare AI…</span>
    </header>
    <div class="work">
      <aside class="side">
        <h2>知识粒子</h2>
        <div class="list" id="nodes"></div>
      </aside>
      <main class="stage">
        <canvas id="cv"></canvas>
        <div class="hud" id="hud">数字人拟态 · Cloudflare</div>
      </main>
      <aside class="side right">
        <h2>推理 · Cloudflare Workers AI</h2>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <textarea id="q" placeholder="直接说。不走 LM Studio。"></textarea>
          <button class="btn" id="send">发送</button>
        </div>
      </aside>
    </div>
    <footer>
      <span>归属 liuxiang147 · 模型在 Cloudflare 边缘</span>
      <span id="foot">Workers AI</span>
    </footer>
  </div>
  <script>
    // Nodes shown in the left panel
    const NODES = [
      { t: "AKG 核心", s: "粒子知识体。推理走 Cloudflare Workers AI。" },
      { t: "不走本机", s: "不再连 LM Studio。对话在 Cloudflare 上完成。" },
      { t: "归属", s: "仓库和账号属于 Mr.AK / liuxiang147。" },
    ];

    const $ = (id) => document.getElementById(id);
    const msgs = [];
    let speaking = false;

    function renderNodes() {
      $("nodes").innerHTML = NODES.map((n) => `<div class="card"><b>${n.t}</b><p>${n.s}</p></div>`).join("");
    }

    function addMsg(role, text) {
      msgs.push({ role, text });
      const el = $("msgs");
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "user" : "bot");
      d.textContent = text;
      el.appendChild(d);
      el.scrollTop = el.scrollHeight;
    }

    // Compatible fetch with timeout helper
    function fetchWithTimeout(input, init = {}, ms = 4000) {
      // Prefer AbortSignal.timeout if available
      if (typeof AbortSignal !== 'undefined' && 'timeout' in AbortSignal) {
        return fetch(input, { ...init, signal: AbortSignal.timeout(ms) });
      }
      const ac = new AbortController();
      const id = setTimeout(() => ac.abort(), ms);
      return fetch(input, { ...init, signal: ac.signal }).finally(() => clearTimeout(id));
    }

    // Get a Chinese voice (async) with fallback
    function getChineseVoice(timeout = 2000) {
      return new Promise((resolve) => {
        try {
          const voices = speechSynthesis.getVoices();
          const findVoice = (list) => list.find(v => v && v.lang && v.lang.startsWith('zh')) || null;
          const v = voices && voices.length ? findVoice(voices) : null;
          if (v) return resolve(v);
          const onvoices = () => {
            const v2 = findVoice(speechSynthesis.getVoices());
            speechSynthesis.onvoiceschanged = null;
            resolve(v2);
          };
          speechSynthesis.onvoiceschanged = onvoices;
          // timeout fallback
          setTimeout(() => {
            speechSynthesis.onvoiceschanged = null;
            resolve(null);
          }, timeout);
        } catch (e) { resolve(null); }
      });
    }

    async function speak(text) {
      if (!('speechSynthesis' in window)) return;
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[#*_`]/g, ' ').slice(0, 800));
        u.lang = 'zh-CN'; u.rate = 1.12; u.pitch = 1.12;
        const v = await getChineseVoice(1500);
        if (v) u.voice = v;
        speaking = true; u.onend = () => { speaking = false; };
        speechSynthesis.speak(u);
      } catch (e) {
        console.warn('speech failed', e);
      }
    }

    async function ping() {
      try {
        const r = await fetchWithTimeout('/api/health', {}, 4000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        if (j && j.ok && j.bound) {
          $("status").textContent = "Cloudflare AI 已就绪";
          $("status").className = "chip ok";
          $("foot").textContent = j.engine || 'Workers AI';
        } else if (j && j.ok) {
          $("status").textContent = "页面已上 · 还需绑定 Workers AI";
          $("status").className = "chip bad";
        } else throw new Error('bad');
      } catch (e) {
        console.warn('ping error', e);
        $("status").textContent = "还没部署到 Cloudflare Pages";
        $("status").className = "chip bad";
        $("foot").textContent = "GitHub Pages 没有模型";
      }
    }

    // Build messages for the API: keep recent history and avoid huge payloads
    function buildMessages() {
      const ctx = NODES.map(n => `【${n.t}】${n.s}`).join('\n');
      const recent = msgs.slice(-12); // keep only the last 12 entries
      const mapped = recent.map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.text }));
      return { system: ctx, messages: [{ role: 'system', content: ctx }, ...mapped] };
    }

    async function chat() {
      const q = $("q").value.trim();
      if (!q) return;
      $("q").value = '';
      addMsg('user', q);
      $("send").disabled = true;
      try {
        const payload = buildMessages();
        const r = await fetchWithTimeout('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: payload.messages }),
        }, 12000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        const text = (j.text || j.answer || j.error || '没有返回').trim();
        addMsg('bot', text);
        if (j.text) speak(text);
        if (j.model) $("foot").textContent = j.model;
      } catch (e) {
        console.warn('chat error', e);
        addMsg('bot', '连不上 Cloudflare 模型。要把仓库连到 Cloudflare Pages，并绑定 Workers AI。');
      }
      $("send").disabled = false;
    }

    const cv = $("cv");
    const ctx = cv.getContext('2d');
    let pts = [];

    function makePts(count) {
      return Array.from({ length: count }, () => ({ a: Math.random() * Math.PI * 2, r: 40 + Math.random() * 110 }));
    }

    function resize(){
      const dpr = window.devicePixelRatio || 1;
      cv.width = Math.floor(cv.clientWidth * dpr);
      cv.height = Math.floor(cv.clientHeight * dpr);
      // ensure drawing is crisp on high DPI
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      // regenerate points adaptively (cap to 900)
      const area = Math.max(1, cv.clientWidth * cv.clientHeight);
      const count = Math.max(120, Math.min(900, Math.floor(area / 600))); // heuristic
      pts = makePts(count);
    }

    function draw(t){
      const w = cv.width, h = cv.height;
      ctx.fillStyle = '#05070a'; ctx.fillRect(0,0,w,h);
      const cx = (w/2) / (window.devicePixelRatio || 1), cy = (h*0.48) / (window.devicePixelRatio || 1);
      const pulse = speaking ? 1.08 + Math.sin(t/80) * 0.06 : 1;
      const dpr = window.devicePixelRatio || 1;
      pts.forEach((p,i) => {
        const x = cx + Math.cos(p.a + t/4000) * p.r * pulse;
        const y = cy + Math.sin(p.a*1.3 + t/3500) * p.r * 0.72 * pulse + Math.sin(i + t/500) * 6;
        ctx.fillStyle = i%7===0 ? 'rgba(168,85,247,.85)' : 'rgba(34,211,238,.8)';
        // draw a 1.6px square in CSS pixels
        ctx.fillRect(x, y, 1.6, 1.6);
      });
      requestAnimationFrame(draw);
    }

    // Speech recognition / microphone with better error handling
    function startRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { addMsg('bot', '这台浏览器没有语音识别。'); return; }
      try {
        const rec = new SR(); rec.lang = 'zh-CN';
        rec.onresult = (e) => { $("q").value = e.results[0][0].transcript || ''; chat(); };
        rec.onerror = (ev) => { addMsg('bot', '语音识别失败：' + (ev.error || '未知错误')); };
        rec.onend = () => { /* noop */ };
        rec.start();
      } catch (e) {
        console.warn('rec error', e); addMsg('bot', '启动语音识别失败。');
      }
    }

    // wire up UI
    $("send").onclick = chat;
    $("q").addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chat(); } });

    // small helper: debounce resize
    let _rt;
    window.addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(resize, 120); });

    renderNodes();
    addMsg('bot', '现在不走 LM Studio。对话走 Cloudflare。把仓库连上 Pages 并绑定 AI 之后就能聊。');
    resize(); requestAnimationFrame(draw); ping();

    // optional mic button if you want to enable later
    // document.querySelector('#mic')?.addEventListener('click', startRecognition);
  </script>
</body>
</html>
