<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AKG · liuxiang147</title>
  <style>
    :root { --bg:#05070a; --panel:#0a0c14; --line:rgba(34,211,238,.28); --cyan:#22d3ee; --txt:#e8eef4; --dim:#8b98a8; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif; overflow:hidden; }
    button { cursor:pointer; font-family:inherit; }
    #app { display:flex; flex-direction:column; height:100%; }
    header { height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; border-bottom:1px solid rgba(34,211,238,.2); background:#0a0c14; gap:8px; flex-shrink:0; }
    .brand { display:flex; align-items:center; gap:8px; font-family:ui-monospace,Menlo,monospace; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 10px var(--cyan); }
    .brand h1 { font-size:13px; letter-spacing:.18em; margin:0; }
    .brand small { color:var(--cyan); opacity:.7; font-size:10px; }
    .row { display:flex; align-items:center; gap:8px; }
    select, input, textarea { background:#05070a; color:var(--cyan); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:6px 8px; font-size:12px; font-family:ui-monospace,Menlo,monospace; }
    .chip { font-size:10px; font-family:ui-monospace,Menlo,monospace; padding:2px 8px; border-radius:6px; border:1px solid rgba(34,211,238,.35); color:#a5f3fc; background:rgba(6,78,92,.4); }
    .chip.ok { border-color:#34d399; color:#6ee7b7; }
    .chip.bad { border-color:#f43f5e; color:#fda4af; }
    .work { flex:1; display:grid; grid-template-columns:280px 1fr 380px; min-height:0; }
    @media (max-width: 960px) { .work { grid-template-columns:1fr; } .side { display:none; } .side.show { display:flex; position:absolute; inset:52px 0 28px 0; z-index:20; } }
    .side { background:rgba(10,12,20,.92); border-right:1px solid rgba(255,255,255,.06); display:flex; flex-direction:column; min-height:0; }
    .side.right { border-right:0; border-left:1px solid rgba(255,255,255,.06); }
    .side h2 { margin:0; padding:10px 12px; font-size:11px; letter-spacing:.12em; color:var(--cyan); font-family:ui-monospace,Menlo,monospace; border-bottom:1px solid rgba(255,255,255,.06); }
    .list { flex:1; overflow:auto; padding:8px; }
    .card { padding:10px; border:1px solid rgba(255,255,255,.08); border-radius:10px; margin-bottom:8px; cursor:pointer; }
    .card:hover, .card.on { border-color:var(--cyan); background:rgba(34,211,238,.08); }
    .card b { display:block; font-size:13px; margin-bottom:4px; }
    .card p { margin:0; font-size:11px; color:var(--dim); line-height:1.45; }
    .stage { position:relative; background:#05070a; }
    canvas { width:100%; height:100%; display:block; }
    .hud { position:absolute; left:12px; top:12px; font-size:11px; font-family:ui-monospace,Menlo,monospace; color:#67e8f9; background:rgba(0,0,0,.55); padding:6px 10px; border-radius:8px; border:1px solid rgba(255,255,255,.08); }
    .msgs { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
    .msg { font-size:13px; line-height:1.55; padding:10px 12px; border-radius:10px; max-width:95%; }
    .msg.user { align-self:flex-end; background:rgba(34,211,238,.12); border:1px solid rgba(34,211,238,.25); }
    .msg.bot { align-self:flex-start; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
    .composer { padding:10px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:8px; }
    .composer textarea { flex:1; resize:none; height:64px; color:var(--txt); }
    .btn { background:rgba(34,211,238,.15); color:#a5f3fc; border:1px solid rgba(34,211,238,.4); border-radius:8px; padding:8px 12px; font-size:12px; }
    .btn:disabled { opacity:.4; }
    .btn.ghost { background:transparent; color:var(--dim); border-color:rgba(255,255,255,.12); }
    footer { height:28px; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:10px; font-family:ui-monospace,Menlo,monospace; color:var(--dim); border-top:1px solid rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="dot"></span>
        <div>
          <h1>AKG 粒子数字知识体</h1>
          <small>liuxiang147.github.io/akg · 归 Mr.AK 所有</small>
        </div>
      </div>
      <div class="row">
        <span id="status" class="chip">检测 LM Studio…</span>
        <select id="base">
          <option value="http://127.0.0.1:1234/v1">本机 127.0.0.1:1234</option>
          <option value="http://172.16.30.171:1234/v1">局域网 172.16.30.171</option>
        </select>
        <button class="btn ghost" id="ping">重连</button>
      </div>
    </header>
    <div class="work">
      <aside class="side">
        <h2>知识粒子 · 本机</h2>
        <div class="list" id="nodes"></div>
      </aside>
      <main class="stage">
        <canvas id="cv"></canvas>
        <div class="hud" id="hud">数字人拟态 · 本机粒子</div>
      </main>
      <aside class="side right">
        <h2>推理 · 只打本机模型</h2>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <textarea id="q" placeholder="直接说。只连本机 LM Studio。"></textarea>
          <div style="display:flex;flex-direction:column;gap:6px">
            <button class="btn" id="send">发送</button>
            <button class="btn ghost" id="mic">对讲</button>
          </div>
        </div>
      </aside>
    </div>
    <footer>
      <span>liuxiang147.github.io/akg · 知识只在本机模型</span>
      <span id="foot">等待本机模型</span>
    </footer>
  </div>
  <script>
    const SYS = `你是挂在这台机器上的 AKG。像熟人说话。禁止结论先行、步骤、是否需授权。本机离线。没有的资料就说没有。`;
    const NODES = [
      { t: "AKG 核心", s: "本机粒子知识体。推理只走 LM Studio。" },
      { t: "离线契约", s: "不经过 Google。请求打 127.0.0.1:1234。" },
      { t: "语音", s: "系统女声朗读。不走云端 TTS。" },
    ];
    const $ = (id) => document.getElementById(id);
    const msgs = [];
    let speaking = false;
    let modelName = "local-model";
    function renderNodes() {
      $("nodes").innerHTML = NODES.map((n,i) => `<div class="card" data-i="${i}"><b>${n.t}</b><p>${n.s}</p></div>`).join("");
    }
    function addMsg(role, text) {
      msgs.push({ role, text });
      const el = $("msgs");
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "user" : "bot");
      d.textContent = text;
      el.appendChild(d);
      el.scrollTop = el.scrollHeight;
    }
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[#*_`]/g," ").slice(0,800));
      u.lang = "zh-CN"; u.rate = 1.12; u.pitch = 1.12;
      const v = speechSynthesis.getVoices().find(x => x.lang.startsWith("zh"));
      if (v) u.voice = v;
      speaking = true; u.onend = () => { speaking = false; };
      speechSynthesis.speak(u);
    }
    async function ping() {
      const base = $("base").value.replace(/\/$/,"");
      $("status").textContent = "连接中…";
      $("status").className = "chip";
      try {
        const r = await fetch(base + "/models", { signal: AbortSignal.timeout(4000) });
        const j = await r.json();
        const id = j.data?.[0]?.id;
        if (id) modelName = id;
        $("status").textContent = "本机已连 " + (id || "LM Studio");
        $("status").className = "chip ok";
        $("foot").textContent = base;
        return true;
      } catch {
        $("status").textContent = "未连上 · 先开 LM Studio 并允许 CORS";
        $("status").className = "chip bad";
        $("foot").textContent = "本机模型未就绪";
        return false;
      }
    }
    async function chat() {
      const q = $("q").value.trim();
      if (!q) return;
      $("q").value = "";
      addMsg("user", q);
      $("send").disabled = true;
      const base = $("base").value.replace(/\/$/,"");
      const ctx = NODES.map(n => `【${n.t}】${n.s}`).join("\n");
      try {
        const r = await fetch(base + "/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: modelName,
            stream: false,
            max_tokens: 1024,
            messages: [
              { role: "system", content: SYS + "\n" + ctx },
              ...msgs.map(m => ({ role: m.role === "bot" ? "assistant" : "user", content: m.text })),
            ],
          }),
        });
        if (!r.ok) throw new Error("模型 " + r.status);
        const j = await r.json();
        const text = (j.choices?.[0]?.message?.content || "").trim() || "本机没返回。";
        addMsg("bot", text);
        speak(text);
      } catch (e) {
        addMsg("bot", "连不上本机模型。打开 LM Studio，开本地服务，勾选 CORS。");
      }
      $("send").disabled = false;
    }
    const cv = $("cv"), ctx = cv.getContext("2d");
    const pts = Array.from({ length: 900 }, () => ({ a: Math.random()*Math.PI*2, r: 40+Math.random()*110, z: Math.random() }));
    function resize(){ cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio; }
    function draw(t){
      const w = cv.width, h = cv.height;
      ctx.fillStyle = "#05070a"; ctx.fillRect(0,0,w,h);
      const cx = w/2, cy = h*0.48, pulse = speaking ? 1.08 + Math.sin(t/80)*0.06 : 1;
      pts.forEach((p,i) => {
        const x = cx + Math.cos(p.a + t/4000)*p.r*pulse*devicePixelRatio;
        const y = cy + Math.sin(p.a*1.3 + t/3500)*p.r*0.72*pulse*devicePixelRatio + Math.sin(i+t/500)*6;
        ctx.fillStyle = i%7===0 ? "rgba(168,85,247,.85)" : "rgba(34,211,238,.8)";
        ctx.fillRect(x,y,1.6*devicePixelRatio,1.6*devicePixelRatio);
      });
      requestAnimationFrame(draw);
    }
    $("send").onclick = chat;
    $("ping").onclick = ping;
    $("q").addEventListener("keydown", (e) => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); chat(); } });
    $("mic").onclick = () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { addMsg("bot","这台浏览器没有语音识别。"); return; }
      const rec = new SR(); rec.lang="zh-CN"; rec.onresult = (e) => { $("q").value = e.results[0][0].transcript; chat(); };
      rec.start();
    };
    window.addEventListener("resize", resize);
    renderNodes();
    addMsg("bot", "这是你的公网 AKG。不经过 Google。先开 LM Studio，再说话。");
    resize(); requestAnimationFrame(draw); ping();
  </script>
</body>
</html>
